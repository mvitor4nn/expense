<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6D28D9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Expense Control"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<title>Expense Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: coluna única de celular com 3 páginas deslizáveis (Início, Histórico, Definições) e barra de abas flutuante. */
:root{
  --bg:#F5F2FB; --surface:#FFFFFF; --surface2:#EEE9F8; --ink:#1D1433; --muted:#665C82; --line:#E3DCF2;
  --accent:#6D28D9; --accent-ink:#FFFFFF; --logo:#6D28D9;
  --ok:#2F7D4F; --warn:#B26A00; --bad:#C62845;
  --shadow:0 10px 28px rgba(60,20,120,.12);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120C20; --surface:#1D1531; --surface2:#2A2046; --ink:#F2EDFC; --muted:#AEA4C9; --line:#35294F;
    --accent:#A78BFA; --accent-ink:#1A0F33;
    --ok:#6FD197; --warn:#F5B84A; --bad:#FF7C93;
    --shadow:0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120C20; --surface:#1D1531; --surface2:#2A2046; --ink:#F2EDFC; --muted:#AEA4C9; --line:#35294F;
  --accent:#A78BFA; --accent-ink:#1A0F33;
  --ok:#6FD197; --warn:#F5B84A; --bad:#FF7C93;
  --shadow:0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--logo);color:#fff;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;box-shadow:0 6px 14px rgba(109,40,217,.35)}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.when-chip{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}

/* páginas deslizáveis */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;
  padding:6px 0 112px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.pager.dragging{user-select:none;cursor:grabbing}
h2.sec{font-family:var(--font-display);font-weight:800;font-size:19px;margin:22px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}

/* total + medidor */
.sumrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sumlabel{font-size:13px;color:var(--muted);font-weight:500}
.sumvalue{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--surface2);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.meter{position:relative;margin:12px 0 4px}
.meter.labeled{padding:22px 0 24px}
.meter.labeled .m-label{line-height:1.2}
.meter.labeled .m-label.top{padding-right:5px}
.meter.labeled .m-label.bot{padding-left:5px}
.track{position:relative;height:10px;border-radius:99px;background:var(--surface2);overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .4s ease}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:2px}
.m-label{position:absolute;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.m-label.top{top:0} .m-label.bot{bottom:0}
.status-note{font-size:13.5px;color:var(--muted);margin:6px 0 0}

/* pizza */
.pie-wrap{display:grid;place-items:center;margin:14px 0 0}
.pie{width:min(232px,64vw);height:auto;overflow:visible;display:block}
.pie path{stroke:var(--bg);stroke-width:2.5;cursor:pointer;transition:transform .18s ease;transform-origin:110px 110px}
.pie path:hover,.pie path:focus-visible{transform:scale(1.04)}
.pie text{pointer-events:none;font-family:var(--font-body);font-weight:700;font-size:12.5px;text-anchor:middle;dominant-baseline:central}
.pie-empty{width:min(232px,64vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;
  text-align:center;padding:30px;color:var(--muted);font-size:14px}

/* bolhas */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.bubble{--c:var(--accent);width:var(--d);height:var(--d);border-radius:50%;border:2px solid var(--c);
  background:color-mix(in srgb,var(--c) 16%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:6px;text-align:center;transition:transform .15s ease,background .15s ease;min-width:0}
.bubble:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.bubble:active{transform:scale(.96)}
.b-name{font-weight:700;font-size:13.5px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.b-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.bubble.month{--c:var(--accent)}
.bubble.month .b-name{font-family:var(--font-display);font-weight:800;font-size:16px}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;margin:26px 0 0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface2);padding:7px 12px 7px 8px;border-radius:999px;font-weight:700;font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:36px 12px;border:2px dashed var(--line);border-radius:20px;font-size:14px}

/* cartões e formulários */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-weight:800;font-size:16px}
.big{font-family:var(--font-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.money{display:flex;align-items:center;gap:8px}
.money span{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent)}
.money .input{font-size:22px;font-weight:700;font-family:var(--font-display)}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 2px;height:28px}
.rowline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.link{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:2px 0}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}

/* barra de abas e botão */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:6px;margin:6px 0 10px;box-shadow:var(--shadow)}
.tab{border:0;background:none;border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.fab{position:absolute;right:4px;bottom:92px;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);padding:13px 18px 13px 14px;font-weight:700;box-shadow:0 10px 24px rgba(109,40,217,.45);z-index:5}
.fab svg{width:20px;height:20px}

/* aviso */
.toast{position:absolute;left:0;right:0;top:6px;z-index:30;display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:13px 12px 13px 13px;box-shadow:var(--shadow);transform:translateY(-140%);
  opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .ico{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--accent)}
.toast.warn .ico{background:var(--warn)} .toast.bad .ico{background:var(--bad)}
.toast b{display:block;font-size:14.5px}
.toast p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.toast .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.toast>div{min-width:0}

/* folha de detalhes */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,8,40,.5);animation:fade .2s ease}
.panel{position:relative;width:100%;max-height:84%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 16px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.25);animation:rise .25s ease;border:1px solid var(--line);border-bottom:0}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sh-dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 14px}
.sh-title{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0;line-height:1.1}
.sh-close{margin-left:auto;border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.txs{list-style:none;margin:8px 0 0;padding:0}
.tx{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.tx-body{min-width:0}
.tx-name{font-weight:700}
.tx-addr{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.tx-when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.tx-side{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tx-price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.formgrid .full{grid-column:1/-1}
/* tema com foto: fundo fixo + camada escura; cartões ficam translúcidos para o texto continuar legível */
.bg-img,.bg-dim{position:fixed;inset:0;z-index:-1;display:none;pointer-events:none}
.bg-img{background:center/cover no-repeat}
.bg-dim{background:#000;opacity:.45}
html.has-bg .bg-img,html.has-bg .bg-dim{display:block}
html.has-bg:root{
  --bg:rgba(18,12,32,.62); --surface:rgba(22,15,40,.58); --surface2:rgba(255,255,255,.16);
  --ink:#FFFFFF; --muted:rgba(255,255,255,.80); --line:rgba(255,255,255,.20);
  --accent:#B79DFF; --accent-ink:#1A0F33; --warn:#FFC766; --bad:#FF8FA3; --ok:#7FDDA5;
  --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
html.has-bg body{background:transparent}
html.has-bg .card,html.has-bg .tabs,html.has-bg .bubble,html.has-bg .back,html.has-bg .empty{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html.has-bg .panel,html.has-bg .toast{background:rgba(22,15,40,.95)}
html.has-bg .top,html.has-bg .sumlabel,html.has-bg .sumvalue,html.has-bg h2.sec,html.has-bg .page>.sub,html.has-bg .status-note,
html.has-bg .hint,html.has-bg .note,html.has-bg .pie-empty{text-shadow:0 1px 10px rgba(0,0,0,.65)}
.theme-prev{height:120px;border-radius:14px;margin-top:12px;border:1.5px dashed var(--line);background:var(--surface2) center/cover no-repeat;
  display:grid;place-items:center;text-align:center;padding:10px;font-size:13px;color:var(--muted)}
.theme-prev.on{border-style:solid}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){ .app{height:calc(100% - 24px);margin-top:12px} }

/* logo vira botão do menu; aceita foto */
.logo{border:0;padding:0;overflow:hidden;cursor:pointer;flex:0 0 40px}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-txt{min-width:0}
.hello{font-size:13px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}

/* barra: disponível */
.avail{font-size:13.5px;font-weight:700;margin:6px 0 0;font-variant-numeric:tabular-nums;color:var(--muted)}
.avail .av{color:var(--ok)}
.status-note.bad{color:var(--bad);font-weight:700}

/* cabeçalho das bolhas + filtro */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sechead h2.sec{margin:0}
.iconbtn{position:relative;flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.cat-title{display:flex;align-items:center;gap:10px;--c:var(--accent)}
.cat-title h2.sec{margin:0}
.b-name{font-size:12.5px;hyphens:auto;-webkit-hyphens:auto}
.b-val{font-size:12px}
.tx-sub{font-size:12px;font-weight:700;color:var(--c,var(--accent));margin-bottom:1px}
html.has-bg .iconbtn{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* folha de filtro */
.flist{margin-top:8px}
.fcat{border-top:1px solid var(--line)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.fchk{display:flex;align-items:center;gap:10px;padding:9px 0;flex:1;min-width:0;cursor:pointer}
.fchk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 20px;margin:0}
.fchk b{font-weight:700}
.fchk.sub{padding-left:30px}
.fchk .sh-dot{flex:0 0 12px;width:12px;height:12px}
.fexp{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:0 0 34px}
.fexp svg{width:16px;height:16px;transition:transform .15s ease}
.fexp[aria-expanded="true"] svg{transform:rotate(180deg)}
.fsubs{padding-bottom:6px}
.btn:disabled{opacity:.45;cursor:default}

/* menu do $ */
.drawer{position:absolute;inset:0;z-index:40;display:flex}
.d-scrim{position:absolute;inset:0;background:rgba(20,8,40,.55);animation:fade .2s ease}
.d-panel{position:relative;width:min(90%,380px);height:100%;background:var(--surface);border-right:1px solid var(--line);
  box-shadow:12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column;animation:slidein .25s ease;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
.d-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.d-head .logo{cursor:default}
.d-who{min-width:0;flex:1}
.d-body{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 28px;scrollbar-width:none}
.d-body::-webkit-scrollbar{display:none}
.d-list{display:flex;flex-direction:column;gap:2px}
.d-item{display:flex;align-items:center;gap:14px;border:0;background:none;padding:16px 6px;border-radius:14px;text-align:left;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--ink)}
.d-item:active{background:var(--surface2)}
.d-item .ic{width:26px;height:26px;color:var(--accent);flex:0 0 26px}
.d-item .go{margin-left:auto;width:18px;height:18px;color:var(--muted)}
.d-vhead{margin:4px 0 0}
.d-panel .card{background:var(--surface2);box-shadow:none}
.d-panel .card .btn.ghost{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.lang-opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;margin-top:10px;color:var(--ink)}
.lang-opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.lang-opt .tick-ok{color:var(--accent);font-weight:800}
.av-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.av-prev{width:64px;height:64px;font-size:34px;border-radius:20px;flex:0 0 64px}
html.has-bg .d-panel{background:rgba(22,15,40,.97)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid #dadce0;background:#fff;color:#1f1f1f;border-radius:999px;padding:12px 16px;font-weight:700;margin-top:12px}
.gbtn svg{width:20px;height:20px;flex:0 0 20px}
.gbtn:disabled{opacity:.6}
.g-as{margin:12px 0 0;font-size:14px;word-break:break-all}
.g-msg{margin:10px 0 0;font-size:13px;color:var(--muted)}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
</style>

<div class="bg-img" id="bgImg" aria-hidden="true"></div>
<div class="bg-dim" id="bgDim" aria-hidden="true"></div>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <button class="logo" id="logoBtn" type="button" aria-label="Menu" data-i18n-aria="menu_aria">$</button>
      <div class="brand-txt"><div class="wordmark">Expense Control</div><div class="hello" id="hello" hidden></div></div>
    </div>

function pie(by,total,month){
  var items=CATS.filter(function(c){return by[c.id]>0});
  if(!items.length)return '<div class="pie-empty">'+L('pie_empty')+'</div>';
  var cx=110,cy=110,r=100,a=-Math.PI/2,out='<svg class="pie" viewBox="0 0 220 220" role="img" aria-label="'+L('pie_aria')+'">';
  var labels='';
  items.forEach(function(c){
    var v=by[c.id],ang=v/total*Math.PI*2,pct=Math.round(v/total*100);
    var attrs=' data-cat="'+c.id+'" data-month="'+month+'" role="button" tabindex="0" aria-label="'+esc(cn(c.id))+', '+brl(v)+', '+pct+'%" fill="'+c.color+'"';
    if(items.length===1){out+='<circle cx="110" cy="110" r="100"'+attrs+' style="stroke:var(--bg);stroke-width:2.5;cursor:pointer"/>'}
    else{
      var x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a+ang),y2=cy+r*Math.sin(a+ang);
      out+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+(ang>Math.PI?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z"'+attrs+'/>';
    }
    if(v/total>=0.07){var mid=a+ang/2;labels+='<text x="'+(cx+r*0.64*Math.cos(mid)).toFixed(1)+'" y="'+(cy+r*0.64*Math.sin(mid)).toFixed(1)+'" fill="'+c.ink+'">'+pct+'%</text>'}
    a+=ang;
  });
  return out+labels+'</svg>';
}

var drill={home:null,hist:null};
function fActive(){return S.fsubs.length>0}
function fOn(sub){return !fActive()||S.fsubs.indexOf(sub)>-1}
function bubD(v,max,lo,hi){return Math.round(lo+(hi-lo)*Math.sqrt(v/max))}
function bubble(name,val,color,d,attrs,cls){
  return '<button class="bubble'+(cls?' '+cls:'')+'" type="button" style="--c:'+color+';--d:'+d+'px" '+attrs+'><span class="b-name">'+esc(name)+'</span><span class="b-val">'+brl(val)+'</span></button>';

var ICON_FILTER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>';

function filterBtn(month){

function bubbleBlock(month,scope){
  var by={},bySub={};

  var fb=filterBtn(month),h,items,max;

      '<p class="sub" style="margin-top:4px">'+L('total_spent',{x:'<b>'+brl(by[c.id])+'</b>'})+'</p><div style="height:14px"></div>'+
      '<div class="bubbles">'+items.map(function(s){

      }).join('')+'</div>';

    items=CATS.filter(function(x){return by[x.id]>0});
    h='<div class="sechead"><h2 class="sec">'+L('categories')+'</h2>'+fb+'</div>';
    if(!items.length)h+='<div class="empty">'+L('filter_none')+'<div style="margin-top:12px"><button class="btn ghost" type="button" data-fclear>'+L('filter_clear')+'</button></div></div>';

        return bubble(cn(x.id),by[x.id],x.color,bubD(by[x.id],max,96,150),'data-drill="'+x.id+'" data-scope="'+scope+'"');
      }).join('')+'</div>';
    }
  }
  return h;

var toastTimer;
function toast(kind,title,msg){
  var el=$('#toast');el.className='toast '+kind;$('#toastTitle').textContent=title;$('#toastMsg').textContent=msg;
  $('#toastIco').textContent=kind==='info'?'✓':'!';

  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,kind==='info'?3200:9000);
}

function alertCopy(kind,spent,pct){
  if(kind==='bad')return [L('a_bad_t',{p:S.limit}),L('a_bad_m',{a:brl(spent),b:brl(S.salary),p:Math.round(pct)})];
  return [L('a_warn_t',{p:S.warn}),L('a_warn_m',{a:brl(spent),b:brl(S.salary),p:S.limit,c:brl(S.salary*S.limit/100)})];

function checkAlerts(){
  if(!(S.salary>0))return;
  var spent=sum(ofMonth(CUR)).total,pct=spent/S.salary*100,a=S.alerts[CUR]||(S.alerts[CUR]={});
  var hitL=pct>=S.limit,hitW=pct>=S.warn;

}

function shrink(file,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var m=1400,k=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');

  };

  im.src=url;
}

var MK='cifrao-music-v1',M={on:true,vol:50,name:null};
try{var mo=JSON.parse(localStorage.getItem(MK));if(mo&&typeof mo==='object'){M.on=mo.on!==false;M.vol=isFinite(mo.vol)?Math.max(0,Math.min(100,+mo.vol)):50;M.name=mo.name||null}}catch(e){}
function saveM(){try{localStorage.setItem(MK,JSON.stringify(M))}catch(e){}}

/* o arquivo de áudio escolhido fica no IndexedDB (grande demais para o localStorage) */
function idb(cb){
  try{var r=indexedDB.open('cifrao-music',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('f')};
    r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)};
  }catch(e){cb(null)}
}
function idbGet(cb){idb(function(db){if(!db){cb(null);return}try{var q=db.transaction('f').objectStore('f').get('track');q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}catch(e){cb(null)}})}
function idbPut(blob,cb){idb(function(db){
  if(!db){cb(false);return}
  var done=false;function fin(v){if(!done){done=true;cb(v)}}
  try{var t=db.transaction('f','readwrite');t.objectStore('f').put(blob,'track');t.oncomplete=function(){fin(true)};t.onerror=function(){fin(false)};t.onabort=function(){fin(false)}}catch(e){fin(false)}
})}
function idbDel(){idb(function(db){if(!db)return;try{db.transaction('f','readwrite').objectStore('f').delete('track')}catch(e){}})}

var mLoaded=false,mStarted=false,mBlob=null,aud=null,audUrl=null;
var AC=null,bus=null,master=null,genTimer=null,genNext=0,genStep=0;
/* trilha padrão: pad sombrio em Lá menor (Am – F – C – E) com arpejo suave e eco, gerada pelo próprio app, em loop */
var CHORDS=[[57,60,64],[53,57,60],[48,52,55],[52,56,59]],ARP=[0,1,2,1,2,1,0,1];
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function tone(t,f,dur,type,peak,atk){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);
}
function genInit(){
  var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;
  AC=new Ctx();master=AC.createGain();bus=AC.createGain();
  var dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();
  dl.delayTime.value=.45;fb.gain.value=.4;wet.gain.value=.35;
  bus.connect(master);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
  master.connect(AC.destination);return true;
}
function genTick(){
  while(genNext<AC.currentTime+1.5){
    var ch=CHORDS[Math.floor(genStep/16)%CHORDS.length],si=genStep%16,t=genNext;
    if(si===0){
      ch.forEach(function(n){tone(t,mtof(n),9.5,'triangle',.05,2.5);tone(t,mtof(n)*1.004,9.5,'sine',.04,2.5)});
      tone(t,mtof(ch[0]-12),8,'sine',.18,.8);
    }
    if(si%8!==7)tone(t,mtof(ch[ARP[si%8]]+12+(si%4===3?12:0)),1.8,'triangle',.05,.02);
    genStep++;genNext+=.5;
  }
}
function genPlay(){
  if(!AC&&!genInit())return;
  master.gain.value=M.vol/100*.9;
  var rp=AC.resume();if(rp&&rp.then)rp.then(function(){if(AC.state!=='running'){mStarted=false;armTap()}},function(){});
  if(!genTimer){genNext=Math.max(genNext,AC.currentTime+.15);genTick();genTimer=setInterval(genTick,400)}
}
function genPause(){if(genTimer){clearInterval(genTimer);genTimer=null}if(AC&&AC.state==='running')AC.suspend()}
function audPlay(){
  if(!aud){aud=new Audio();aud.loop=true;aud.preload='auto'}
  if(!audUrl){audUrl=URL.createObjectURL(mBlob);aud.src=audUrl}
  aud.volume=M.vol/100;
  var p=aud.play();if(p&&p.catch)p.catch(function(){mStarted=false;armTap()});
}
function audDrop(){if(aud){aud.pause();aud.removeAttribute('src');aud.load()}if(audUrl){URL.revokeObjectURL(audUrl);audUrl=null}}
function musPlay(){
  if(!mLoaded||!mStarted||!M.on)return;
  if(mBlob){genPause();audPlay()}else{if(aud)aud.pause();genPlay()}
}
function musPause(){if(aud)aud.pause();genPause()}
function setVol(){if(aud)aud.volume=M.vol/100;if(master)master.gain.value=M.vol/100*.9}
/* navegadores só liberam áudio depois de um toque: começa no primeiro */
var TAPS=['click','touchend','keydown'];
function firstTap(){TAPS.forEach(function(n){document.removeEventListener(n,firstTap,true)});mStarted=true;musPlay()}
function armTap(){TAPS.forEach(function(n){document.addEventListener(n,firstTap,true)})}
armTap();

function cropSquare(file,size,cb){

}

/* ---------- backup na conta Google (Google Drive, pasta privada do app) ---------- */
/* Cole aqui o "ID do cliente" criado no Google Cloud (passo a passo em GOOGLE-SETUP.md). */
var GOOGLE_CLIENT_ID='';
var GFILE='expense-control-backup.json',GK='cifrao-google-v1',G={email:'',last:0};
try{var gsv=JSON.parse(localStorage.getItem(GK));if(gsv&&typeof gsv==='object'){G.email=typeof gsv.email==='string'?gsv.email:'';G.last=+gsv.last||0}}catch(e){}
function saveG(){try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}}
var gTok=null,gExp=0,gBusy=false,gChoice=null,gMsg='',gTimer;
var GLOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function gValid(){return !!gTok&&Date.now()<gExp-30000}
function gStamp(ms){try{return new Date(ms).toLocaleString(LOC[lang],{dateStyle:'short',timeStyle:'short'})}catch(e){return new Date(ms).toLocaleString()}}
function gLib(ok,fail){
  if(window.google&&google.accounts&&google.accounts.oauth2){ok();return}
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=fail;document.head.appendChild(s);
}
function gToken(ok,fail){
  if(gValid()){ok();return}
  gLib(function(){
    try{
      var tc=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email',
        callback:function(r){if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;ok()}else fail()},
        error_callback:function(){fail()}
      });
      tc.requestAccessToken({prompt:G.email?'':'select_account'});
    }catch(e){fail()}
  },fail);
}
function gApi(url,opt,asText){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+gTok},opt.headers||{});
  return fetch(url,opt).then(function(r){if(!r.ok)throw new Error('http '+r.status);return asText?r.text():r.json()});
}
function gFind(){
  return gApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy='+encodeURIComponent('modifiedTime desc')+
    '&q='+encodeURIComponent("name='"+GFILE+"'")+'&fields='+encodeURIComponent('files(id,modifiedTime)'))
    .then(function(j){return (j.files&&j.files[0])||null});
}
function gPayload(){return {app:'expense-control',v:1,savedAt:Date.now(),state:S,avatar:AV}}
function gUpload(id){
  var meta=id?{}:{name:GFILE,parents:['appDataFolder']},bd='cifrao'+Date.now().toString(36);
  var body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(gPayload())+'\r\n--'+bd+'--';
  return gApi('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id',
    {method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body});
}
function gPushNow(){
  return gFind().then(function(f){return gUpload(f&&f.id)}).then(function(){G.last=Date.now();saveG()});
}
/* depois do primeiro backup, cada alteração é enviada sozinha (enquanto o acesso estiver ativo) */
function gSchedule(){
  if(!G.email||!gValid()||gChoice||gBusy)return;
  clearTimeout(gTimer);
  gTimer=setTimeout(function(){gPushNow().then(renderGoogle,function(){})},4000);
}
function gRestoreFrom(file){
  return gApi('https://www.googleapis.com/drive/v3/files/'+file.id+'?alt=media').then(function(p){
    if(!p||!p.state||!Array.isArray(p.state.expenses))throw new Error('bad backup');
    S=migrate(p.state);AV=typeof p.avatar==='string'?p.avatar:null;saveAv();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    setLangVar(S.lang);histMonth=null;drill.home=drill.hist=null;
    $('#nick').value=S.nick;applyAvatar();applyLang();
  });
}
function gEnd(msg){gBusy=false;gMsg=msg||'';renderGoogle()}
function gFail(){gEnd(L('g_err'))}
function userHasData(){return !S.sample||S.expenses.some(function(e){return e.id.charAt(0)==='u'})}
function gAct(a){
  if(gBusy)return;
  if(a==='signin'){
    if(!GOOGLE_CLIENT_ID){gMsg=L('g_unconf');renderGoogle();return}
    gBusy=true;gMsg='';renderGoogle();
    gToken(function(){
      gApi('https://www.googleapis.com/oauth2/v3/userinfo').then(function(u){
        G.email=u.email||'—';saveG();
        return gFind().then(function(f){
          if(!f)return gUpload(null).then(function(){G.last=Date.now();saveG();gEnd(L('g_ok_saved'))});
          if(!userHasData())return gRestoreFrom(f).then(function(){G.last=Date.now();saveG();gEnd(L('g_ok_restored'))});
          gChoice=f;gEnd('');
        });
      }).catch(gFail);
    },gFail);
  }
  else if(a==='save'){
    gBusy=true;gMsg='';renderGoogle();
    gToken(function(){gPushNow().then(function(){gEnd(L('g_ok_saved'))}).catch(gFail)},gFail);
  }
  else if(a==='restore'){
    gBusy=true;gMsg='';renderGoogle();
    gToken(function(){
      gFind().then(function(f){
        if(!f){gEnd(L('g_none'));return}
        gBusy=false;
        if(!confirm(L('g_confirm'))){gEnd('');return}
        gBusy=true;renderGoogle();
        return gRestoreFrom(f).then(function(){G.last=Date.now();saveG();gEnd(L('g_ok_restored'))});
      }).catch(gFail);
    },gFail);
  }
  else if(a==='usecloud'&&gChoice){
    var f=gChoice;gChoice=null;gBusy=true;renderGoogle();
    gRestoreFrom(f).then(function(){G.last=Date.now();saveG();gEnd(L('g_ok_restored'))}).catch(gFail);
  }
  else if(a==='keeplocal'&&gChoice){
    var f2=gChoice;gChoice=null;gBusy=true;renderGoogle();
    gUpload(f2.id).then(function(){G.last=Date.now();saveG();gEnd(L('g_ok_saved'))}).catch(gFail);
  }
  else if(a==='out'){
    try{if(gTok&&window.google&&google.accounts)google.accounts.oauth2.revoke(gTok,function(){})}catch(e){}
    gTok=null;gExp=0;gChoice=null;G={email:'',last:0};saveG();gEnd('');
  }
}
function renderGoogle(){
  var el=$('#gBody');if(!el)return;
  var h='',dis=gBusy?' disabled':'';
  if(!G.email){
    h='<button class="gbtn" type="button" data-gact="signin"'+dis+'>'+GLOGO+'<span>'+L('g_btn')+'</span></button>';
  }else{
    h='<p class="g-as">'+L('g_as',{e:'<b>'+esc(G.email)+'</b>'})+'</p>'+
      '<p class="g-msg" style="margin-top:4px">'+(G.last?L('g_last',{d:gStamp(G.last)}):L('g_never'))+'</p>';
    if(gChoice)h+='<p class="g-msg">'+L('g_found',{d:gStamp(Date.parse(gChoice.modifiedTime)||Date.now())})+'</p>'+
      '<div class="btns" style="margin-top:10px"><button class="btn" type="button" data-gact="usecloud"'+dis+'>'+L('g_use_cloud')+'</button><button class="btn ghost" type="button" data-gact="keeplocal"'+dis+'>'+L('g_keep_local')+'</button></div>';
    else h+='<div class="btns" style="margin-top:12px"><button class="btn" type="button" data-gact="save"'+dis+'>'+L('g_save')+'</button><button class="btn ghost" type="button" data-gact="restore"'+dis+'>'+L('g_restore')+'</button></div>'+
      '<p style="margin:12px 0 0"><button class="link" type="button" data-gact="out">'+L('g_out')+'</button></p>';
  }
  if(gBusy)h+='<p class="g-msg" role="status">'+L('g_busy')+'</p>';
  else if(gMsg)h+='<p class="g-msg" role="status">'+esc(gMsg)+'</p>';
  el.innerHTML=h;
}
